<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc"><title id="title">Virtual-patient communication training: proposed learner journey</title><desc id="desc">Main menu leads to chapter selection, then a training conversation with an objectives checklist and a separate quality assessment, followed by a performance summary. Learners can retry or choose another chapter. Nour's primary contribution is screens and functionality. This is a conceptual flow, not a screenshot or a claim of completed features.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#686868"/></marker></defs><rect width="1100" height="900" rx="12" fill="#fafafa"/><g font-family="Arial, Helvetica, sans-serif"><text font-family="Arial" x="48" y="47" font-size="12" font-weight="700" letter-spacing="2" fill="#666">HONORS CAPSTONE / UNITY / IN DEVELOPMENT</text><text font-family="Arial" x="48" y="91" font-size="30" font-weight="700" fill="#161616">Practice a conversation. Reflect. Try again.</text><text font-family="Arial" x="48" y="121" font-size="16" fill="#555">A proposed training experience for healthcare learners discussing substance use.</text><rect x="48" y="165" width="458" height="178" rx="8" fill="white" stroke="#d4d4d4"/><text font-family="Arial" x="72" y="196" font-size="12" fill="#666" font-weight="700">01 / WELCOME</text><text font-family="Arial" x="72" y="230" font-size="23" fill="#161616" font-weight="700">Main menu</text><text font-family="Arial" x="72" y="263" font-size="15" fill="#555">Start training or select a chapter.</text><text font-family="Arial" x="72" y="288" font-size="15" fill="#555">Access progress and settings.</text><text font-family="Arial" x="72" y="313" font-size="15" fill="#555">Friendly guidance introduces the experience.</text><rect x="594" y="165" width="458" height="178" rx="8" fill="white" stroke="#d4d4d4"/><text font-family="Arial" x="618" y="196" font-size="12" fill="#666" font-weight="700">02 / CHOOSE</text><text font-family="Arial" x="618" y="230" font-size="23" fill="#161616" font-weight="700">Chapter selection</text><text font-family="Arial" x="618" y="263" font-size="15" fill="#555">Read a scenario and communication challenge.</text><text font-family="Arial" x="618" y="288" font-size="15" fill="#555">Choose a patient or family conversation.</text><text font-family="Arial" x="618" y="313" font-size="15" fill="#555">Proposed difficulty levels vary the challenge.</text><path d="M510 253H580" fill="none" stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/><path d="M823 343V373H550V397" fill="none" stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="408" width="1004" height="241" rx="8" fill="#fff" stroke="#161616" stroke-width="1.5"/><text font-family="Arial" x="72" y="439" font-size="12" fill="#666" font-weight="700">03 / PRACTICE</text><text font-family="Arial" x="72" y="473" font-size="23" fill="#161616" font-weight="700">Training conversation</text><text font-family="Arial" x="72" y="503" font-size="16" fill="#555">Virtual characters: prompts guide scenario-consistent symptoms, emotions, and responses.</text><rect x="72" y="527" width="297" height="100" rx="5" fill="#f3f3f3"/><text font-family="Arial" x="88" y="553" font-size="16" fill="#161616" font-weight="700">Objectives checklist</text><text font-family="Arial" x="88" y="578" font-size="14" fill="#555">Did the learner complete</text><text font-family="Arial" x="88" y="599" font-size="14" fill="#555">the communication steps?</text><rect x="393" y="527" width="297" height="100" rx="5" fill="#f3f3f3"/><text font-family="Arial" x="409" y="553" font-size="16" fill="#161616" font-weight="700">Communication quality</text><text font-family="Arial" x="409" y="578" font-size="14" fill="#555">How effectively did the learner</text><text font-family="Arial" x="409" y="599" font-size="14" fill="#555">communicate with the patient?</text><rect x="714" y="527" width="297" height="100" rx="5" fill="#f3f3f3"/><text font-family="Arial" x="730" y="553" font-size="16" fill="#161616" font-weight="700">Real-time guidance</text><text font-family="Arial" x="730" y="578" font-size="14" fill="#555">Supportive feedback designed</text><text font-family="Arial" x="730" y="599" font-size="14" fill="#555">to limit interruptions.</text><path d="M550 649V679" fill="none" stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="690" width="1004" height="117" rx="8" fill="white" stroke="#d4d4d4"/><text font-family="Arial" x="72" y="720" font-size="12" fill="#666" font-weight="700">04 / REFLECT</text><text font-family="Arial" x="72" y="755" font-size="23" fill="#161616" font-weight="700">Performance summary</text><text font-family="Arial" x="72" y="783" font-size="15" fill="#555">Review strengths, missed objectives, and suggestions for the next attempt.</text><path d="M1052 749H1075V253H1056" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text font-family="Arial" x="770" y="832" font-size="13" fill="#555">Retry the chapter or choose another</text><path d="M48 849H1052" stroke="#dedede"/><text font-family="Arial" x="48" y="875" font-size="14" fill="#161616" font-weight="700">My primary contribution: screens and their functionality.</text><text font-family="Arial" x="48" y="893" font-size="11" fill="#555">Conceptual project flow; character realism, prompt engineering, and assessment are in development.</text><g fill="#686868"><path d="M580 253l-10 -5v10z"/><path d="M550 397l-5 -10h10z"/><path d="M550 679l-5 -10h10z"/><path d="M1056 253l10 -5v10z"/></g></g></svg>